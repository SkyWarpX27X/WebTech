<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
</head>
<body>
    <form>
        <label for="name">Full name:</label><br>
        <input type="text" id="name" name="name"><br>
        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br>
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label><br>
        <label for="birth_date">Date of birth:</label><br>
        <input type="text" id="birth_date" name="birth_date"><br>
        <label for="email">Email:</label><br>
        <input type="text" id="email" name="email"><br>
        <label for="phone_number">Phone number:</label><br>
        <input type="text" id="phone_number" name="phone_number"><br>
        <p>Background colour:</p>
        <input type="radio" id="white" name="background_colour" value="White">
        <label for="white">White</label><br>
        <input type="radio" id="blue" name="background_colour" value="Blue">
        <label for="blue">Blue</label><br>
        <input type="radio" id="green" name="background_colour" value="Green">
        <label for="green">Green</label><br>
        <input type="radio" id="red" name="background_colour" value="Red">
        <label for="red">Red</label><br>
        <label for="country">Counrty:</label><br>
        <input type="text" id="country" name="country"><br>
        <label for="city">City:</label><br>
        <input type="text" id="city" name="city"><br>
        <label for="comment">Comment:</label><br>
        <input type="text" id="comment" name="comment"><br>
        <input type="submit" id="submit" name="submit"><br>
    </form>
</body>
</html>
